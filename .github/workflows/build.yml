name: Build Android APK and Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/build.yml'
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate platform files
        run: flutter create --platforms=android --project-name kvaltik_notepad .
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: KvaltikNotepad-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate platform files
        run: flutter create --platforms=windows --project-name kvaltik_notepad .
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package Windows app
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath KvaltikNotepad-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: KvaltikNotepad-Windows
          path: KvaltikNotepad-Windows.zip
